[project]
name = "ds-starter"
version = "0.1.0"
description = "A simple starter project for Python data science students."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jupyterlab>=4.6.6",
    "pandas>=3.1.1",
]

# This section lets uv install the code in src/ds_starter so that
# `import ds_starter` works from scripts, the REPL and notebooks.
[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
